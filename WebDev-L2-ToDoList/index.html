<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#070912">
	<title>Daylist | To-do list</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="app-shell">
		<header class="topbar">
			<a class="brand" href="#" aria-label="Worklist home">
				<span class="brand-mark">W</span>
				<span>Worklist</span>
			</a>
			<div class="date-stamp" id="todayLabel"></div>
			<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" title="Switch to light mode"><span aria-hidden="true">&#9789;</span></button>
		</header>

		<section class="intro" aria-labelledby="pageTitle">
			<p class="eyebrow">MY TASKS</p>
			<h1 id="pageTitle">To-do list</h1>
		</section>

		<section class="overview" aria-label="Task overview">
			<div class="overview-item"><span class="overview-icon">#</span><div><strong id="totalCount">0</strong><span>Total tasks</span></div></div>
			<div class="overview-item"><span class="overview-icon">&middot;</span><div><strong id="overviewPending">0</strong><span>Remaining</span></div></div>
			<div class="overview-item"><span class="overview-icon">&#10003;</span><div><strong id="overviewCompleted">0</strong><span>Completed</span></div></div>
		</section>

		<section class="composer" aria-label="Add a task">
			<form id="taskForm">
				<label class="sr-only" for="taskInput">What needs doing?</label>
				<input id="taskInput" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off" required>
				<button class="primary-button" type="submit"><span>+</span> Add task</button>
			</form>
			<p class="form-message" id="formMessage" role="status"></p>
		</section>
		<a class="list-link" href="tasks.html">View task list <span aria-hidden="true">&rarr;</span></a>

	</main>
	<script src="script.js"></script>
</body>
</html>
